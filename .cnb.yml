# Written by .ci/releases/make-cnb-yml.sh: edit .ci/releases, not this file.
#
# Pushing a v* tag builds every platform and puts what it produced on the
# release. Running one of these pipelines by hand builds that one platform
# and publishes nothing, which is how a change here gets tried.
release:
  push:
    - name: release-config
      docker:
        image: 'node:22'
      stages:
        - name: 'write .cnb.yml'
          script: 'bash .ci/releases/make-cnb-yml.sh'
      ifModify:
        - '.ci/releases/**'
        - '.cnb/tools/**'
  api_trigger_publish:
    - name: release-linux
      docker:
        image: 'node:22'
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      stages:
        - name: build
          script: |-
            npm ci
            npm run dist -- --publish never --linux
        - name: publish
          type: 'cnb:apply'
          options:
            event: api_trigger_publish
      endStages:
        - name: attach
          script: |-
            node .cnb/tools/release.js release
            node .cnb/tools/release.js upload
        - name: mark
          type: 'cnb:resolve'
          options:
            key: release-linux
    - runner:
        tags:
          - 'cnb:arch:amd64'
        cpus: 16
      name: release-macos
      docker:
        image: 'node:22'
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      stages:
        - name: build
          script: |-
            npm ci
            npm run dist -- --publish never --mac
        - name: publish
          type: 'cnb:apply'
          options:
            event: api_trigger_publish
      endStages:
        - name: attach
          script: |-
            node .cnb/tools/release.js release
            node .cnb/tools/release.js upload
        - name: mark
          type: 'cnb:resolve'
          options:
            key: release-macos
    - name: tests
      docker:
        image: 'node:22'
      stages:
        - name: test
          script: 'npm ci && npm test'
    - name: release-windows
      docker:
        image: 'node:22'
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      stages:
        - name: build
          script: |-
            npm ci
            npm run dist -- --publish never --win
        - name: publish
          type: 'cnb:apply'
          options:
            event: api_trigger_publish
      endStages:
        - name: attach
          script: |-
            node .cnb/tools/release.js release
            node .cnb/tools/release.js upload
        - name: mark
          type: 'cnb:resolve'
          options:
            key: release-windows
